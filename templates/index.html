<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management System</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <!-- Dark mode toggle -->
        <div class="theme-toggle">
            <button id="themeBtn" class="theme-btn">🌙</button>
        </div>
        
        <!-- Header -->
        <header class="header">
            <h1 class="title">Student Management Dashboard</h1>
            <p class="subtitle">Manage your students with style ✨</p>
        </header>
        
        <!-- Add Student Form -->
        <section class="form-section">
            <div class="glass-card">
                <h2>Add New Student</h2>
                <form id="studentForm">
                    <input type="text" id="name" placeholder="Full Name" required>
                    <input type="email" id="email" placeholder="Email" required>
                    <input type="text" id="grade" placeholder="Grade (e.g., A, B, 9.5)" required>
                    <button type="submit" class="btn-primary">Add Student 🚀</button>
                </form>
            </div>
        </section>
        
        <!-- Search -->
        <section class="search-section">
            <input type="text" id="searchInput" placeholder="🔍 Search students...">
        </section>
        
        <!-- Students List -->
        <section class="students-section">
            <h2>Students List (<span id="studentsCount">0</span>)</h2>
            <div id="studentsContainer" class="students-grid"></div>
            <div id="noStudents" class="no-data">
                <p>No students yet. Add one above! 🎉</p>
            </div>
        </section>
    </div>
    
    <!-- Edit Modal -->
    <div id="editModal" class="modal">
        <div class="modal-content glass-card">
            <span class="close">&times;</span>
            <h2>Edit Student</h2>
            <form id="editForm">
                <input type="text" id="editName" required>
                <input type="email" id="editEmail" required>
                <input type="text" id="editGrade" required>
                <input type="hidden" id="editId">
                <div class="modal-buttons">
                    <button type="submit" class="btn-primary">Update</button>
                    <button type="button" class="btn-secondary" id="cancelEdit">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
